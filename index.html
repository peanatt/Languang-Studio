<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="เรียน 9 ภาษาสำหรับคนไทย: คำศัพท์ ประโยค แฟลชการ์ด มินิเกม ฝึกพูด และคุยกับ AI">
<meta name="theme-color" content="#2b2350">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Language Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2b2350;--bg2:#3a2f68;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.11);--border:rgba(255,255,255,.13);--text:#f4f0ff;--muted:#c3b9e3;--grad:linear-gradient(90deg,#d0b2ff,#8fe9df);--ok:#7ee2a8;--bad:#ff8fa3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Kanit','Noto Sans Thai',system-ui,sans-serif;color:var(--text);background-color:var(--bg);background-image:radial-gradient(ellipse at 70% 0%,#4a3c7e 0%,var(--bg2) 35%,var(--bg) 75%) fixed;min-height:100vh;font-weight:400;font-size:16px}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #8fe9df;outline-offset:2px}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 22px;border-right:1px solid var(--border);background:rgba(25,18,52,.35);backdrop-filter:blur(6px)}
.brand{font-size:24px;font-weight:600;text-align:center;margin-bottom:38px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;align-items:center;gap:16px;padding:18px 22px;border:0;border-radius:18px;background:transparent;font-size:18px;font-weight:500;text-align:left;transition:background .2s}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.nav .ni{font-size:20px;width:24px;text-align:center}
.side hr{border:0;border-top:1px solid var(--border);margin:auto 0 20px}
.profile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card)}
.avatar{width:46px;height:46px;border-radius:50%;background:#f3e8ff;display:grid;place-items:center;font-size:24px;flex:none}
#pname{font-weight:600;outline:none;display:block;border-radius:6px;padding:0 2px}
#pname:focus{background:rgba(255,255,255,.1)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
main{padding:40px 48px 80px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:34px}
h1{font-size:36px;font-weight:600;line-height:1.2}
.sub{color:var(--muted);margin-top:8px;font-size:17px}
h2{font-size:24px;font-weight:600;margin:40px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;max-width:1060px}
.chip{border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:500;white-space:nowrap}
.chip small,.fl{font-size:11px;font-weight:600;margin-right:6px;letter-spacing:.5px}
.chip.on{background:var(--grad);color:#2b2350;border-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stat .ic{font-size:30px}
.stat .big{font-size:34px;font-weight:600;margin:26px 0 10px}
.muted{color:var(--muted)}
.row-sb{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mt{margin-top:18px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.bar.sm{height:9px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:600;font-size:16px;background:var(--grad);color:#2b2350}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.5;cursor:default}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.cc{text-align:left;font-size:16px;transition:transform .15s,background .2s}
.cc:hover{background:var(--card2);transform:translateY(-2px)}
.cc .ic{font-size:30px}
.cc .cn{font-size:21px;font-weight:600;margin:20px 0 8px}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:transparent;border-radius:14px;padding:10px 18px;font-size:16px}
.tab.on{background:rgba(255,255,255,.14)}
.search{width:100%;max-width:520px;padding:14px 18px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);font-size:16px;margin-bottom:24px}
.search::placeholder,#cin::placeholder{color:var(--muted)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}
.item{display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--border)}
.item.done{border-color:rgba(126,226,168,.45)}
.grow{flex:1;min-width:0}
.it-t{font-size:21px;font-weight:500;word-break:break-word}
.it-r{color:#9fe8de;font-size:14px;margin-top:2px}
.it-th{color:var(--muted);font-size:15px;margin-top:4px}
.it-c{font-size:12px;color:var(--muted);margin-top:4px}
.ibtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.06);font-size:18px}
.ibtn.mk.on{background:var(--ok);color:#1d3b2a;border-color:transparent;font-weight:700}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,14,40,.75);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.fc{width:min(520px,100%);text-align:center}
.flip{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;border-radius:28px;background:var(--card2);border:1px solid var(--border);padding:30px;margin:18px 0;font-size:16px;width:100%}
.flip .ft{font-size:clamp(22px,5vw,34px);font-weight:600;word-break:break-word}
.fcat{font-size:13px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;padding:16px 20px;margin-top:12px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:18px}
.opt:hover:not(:disabled){background:var(--card2)}
.opt.ok{background:rgba(126,226,168,.25);border-color:var(--ok)}
.opt.bad{background:rgba(255,143,163,.2);border-color:var(--bad)}
.qtext{font-size:30px;font-weight:600;margin:14px 0 6px}
.chat{display:flex;flex-direction:column;height:min(70vh,680px);padding:20px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px}
.msg{max-width:80%;padding:14px 18px;border-radius:20px;line-height:1.6;white-space:pre-wrap;font-size:16px}
.msg.u{align-self:flex-end;background:var(--grad);color:#2b2350;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.sayrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.saybtn{border:1px solid var(--border);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px;font-size:14px}
.saybtn:hover{background:rgba(255,255,255,.16)}
.chatbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:0 6px 12px;border-bottom:1px solid var(--border);margin-bottom:8px;font-size:15px;color:var(--muted)}
.chatbar label{display:flex;align-items:center;gap:8px;cursor:pointer}
.chatbar input{width:18px;height:18px;accent-color:#8fe9df}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mb{padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:17px;text-align:left;min-height:58px;word-break:break-word;transition:background .15s}
.mb:hover:not(:disabled){background:var(--card2)}
.mb.sel{border-color:#8fe9df;background:var(--card2);box-shadow:0 0 0 2px rgba(143,233,223,.35)}
.mb.ok{background:rgba(126,226,168,.18);border-color:var(--ok);opacity:.55}
.mb.bad{background:rgba(255,143,163,.25);border-color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc{aspect-ratio:4/3;max-width:100%;border-radius:16px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(208,178,255,.35),rgba(143,233,223,.25));font-size:15px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;word-break:break-word;overflow:hidden}
.mc .mq{font-size:28px;font-weight:600;opacity:.7}
.mc.up{background:var(--card2)}
.mc.ok{background:rgba(126,226,168,.18);border-color:var(--ok)}
.big-q{font-size:clamp(22px,4.6vw,32px);font-weight:600;margin:10px 0;word-break:break-word;line-height:1.4}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid #8fe9df;color:#8fe9df;text-align:center;padding:0 6px}
.toks{display:flex;flex-wrap:wrap;gap:10px;min-height:62px;padding:12px;border-radius:16px;border:1px dashed var(--border);margin-top:14px;align-items:center}
.toks.pool{border-style:solid;background:rgba(255,255,255,.03)}
.toks.ok{border-color:var(--ok)}.toks.bad{border-color:var(--bad)}
.tok{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card2);font-size:18px}
.tok:hover:not(:disabled){border-color:#8fe9df}
.fb{margin-top:16px;padding:14px 18px;border-radius:16px;font-weight:500}
.fb.ok{background:rgba(126,226,168,.18);border:1px solid var(--ok)}
.fb.bad{background:rgba(255,143,163,.16);border:1px solid var(--bad)}
#gin{width:100%;padding:14px 18px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);font-size:20px;margin-top:16px}
#gin::placeholder{color:var(--muted)}
.btn.tf{min-width:140px;font-size:18px;padding:14px 22px}
.btn.tf.no{background:linear-gradient(90deg,#ffb0c0,#ffcf9e)}
.gbest{margin-top:14px;font-size:14px;color:#9fe8de}
.nav .ns{display:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.it-thr{color:#ffd9a8;font-size:14px;margin-top:2px}
.flip .it-thr{font-size:16px;margin-top:6px}
.tab.thrt{border-style:dashed;color:#ffd9a8}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.atile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;border:1px solid var(--border);background:var(--card);transition:background .15s;min-width:0}
.atile:hover{background:var(--card2)}
.ach{font-size:30px;font-weight:600;line-height:1.2;word-break:break-word;text-align:center}
.aro{font-size:12px;color:#9fe8de;text-align:center}.ath{font-size:14px;color:#ffd9a8;text-align:center}
.grc{padding:0;margin-bottom:12px;overflow:hidden}
.grh{display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;background:none;border:0;text-align:left;font-size:17px}
.grn{flex:none;width:32px;height:32px;border-radius:10px;background:var(--grad);color:#2b2350;display:grid;place-items:center;font-weight:600}
.grd{padding:0 20px;color:var(--muted);line-height:1.7}
.grex{display:grid;gap:10px;padding:14px 20px 0}
.grc .btn{margin:14px 20px 20px}
.mic{background:linear-gradient(90deg,#ff9ab0,#ffcf9e)}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,154,176,.25)}}
.dlg{height:auto;max-height:52vh;margin-bottom:16px}
.dnar{align-self:center;font-size:14px;color:var(--muted);text-align:center;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05)}
.dask .opt{margin-top:10px}
.lvbig{font-size:64px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tierbars{max-width:520px;margin:18px auto 0;text-align:left}
.ptcard,.srsc{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.bkta{width:100%;min-height:90px;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:13px;font-family:ui-monospace,monospace;word-break:break-all}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 14px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:#8fe9df}
.chipwrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:1060px;min-width:0}
.accent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.accent .pchip{padding:6px 12px;font-size:14px}
@media (max-width:860px){.chipwrap{align-items:stretch;width:100%}}
.pic{display:grid;place-items:center;flex:none;line-height:1}
.pic.sm{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.07);font-size:28px}
.pic.lg{width:120px;height:120px;border-radius:30px;background:rgba(255,255,255,.08);font-size:68px;margin:6px auto 4px}
.pic.fb{opacity:.45}
.pic.num{font-weight:600;color:#9fe8de;font-variant-numeric:tabular-nums}
.pic.sm.num{font-size:13px}.pic.lg.num{font-size:30px}
.pic .sw{display:block;width:62%;height:62%;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ytgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card.yt{display:flex;align-items:center;gap:14px;padding:18px 20px;text-decoration:none;color:var(--text);transition:background .2s}
.card.yt:hover{background:var(--card2)}
.card.yt .grow{display:flex;flex-direction:column;gap:4px}
.card.yt .muted{font-size:14px;line-height:1.5}
.ytp{flex:none;width:44px;height:32px;border-radius:9px;background:#ff3d3d;color:#fff;display:grid;place-items:center;font-size:14px}
.yto{flex:none;font-size:13px;color:#9fe8de}
@media (max-width:860px){.ytgrid{grid-template-columns:1fr}.pic.sm{width:44px;height:44px;font-size:24px}}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border)}
.vname{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.vst{font-size:13px;padding:3px 10px;border-radius:999px}
.vst.ok{background:rgba(126,226,168,.18);color:var(--ok)}.vst.no{background:rgba(255,143,163,.16);color:var(--bad)}
.vctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
.vsel{max-width:min(320px,100%);padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}
.vhelp{font-size:13px}
.vguide{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.vguide summary{cursor:pointer;font-weight:500}
.vguide ul{margin:12px 0 0 20px;display:grid;gap:8px;color:var(--muted);line-height:1.6}
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.quick button{flex:none;border:1px solid var(--border);background:rgba(255,255,255,.05);border-radius:999px;padding:8px 14px;font-size:14px}
.cin{display:flex;gap:10px}
#cin{flex:1;padding:14px 18px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);font-size:16px}
.pchip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:9px 16px;font-size:15px}
.pchip.on{background:var(--grad);color:#2b2350;border-color:transparent}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--border);text-align:center;font-size:14px}
.day.today{border-color:#8fe9df}
.day.off{opacity:.45}
.day b{display:block;font-size:16px;margin-bottom:8px}
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px;color:var(--muted)}
.chart span.b{width:100%;max-width:44px;background:var(--grad);border-radius:10px 10px 4px 4px;min-height:4px}
.lp{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cbar{display:grid;grid-template-columns:220px 1fr 70px;gap:14px;align-items:center;margin:10px 0}
.cbar .bar{height:10px}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tips .card p{color:var(--muted);margin-top:8px;line-height:1.6}
ul.tl{list-style:none;display:grid;gap:12px}
ul.tl li{padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--border);line-height:1.6}
.astro{position:fixed;right:28px;bottom:24px;font-size:44px;z-index:2;animation:fl 6s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-10px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}.grid3,.tips{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:1fr}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:6px;z-index:20;border-right:0;border-top:1px solid var(--border);background:rgba(30,22,60,.92);padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px))}
 .brand,.side hr,.profile{display:none}
 .nav{flex-direction:row;justify-content:space-around;gap:0}
 .nav button{flex-direction:column;gap:2px;padding:8px 4px;font-size:10px;border-radius:12px}
 .nav .nl{display:none}
 .nav .ns{display:block;text-align:center;line-height:1.2}
 .nav button{min-width:0;flex:1}
 .mem{grid-template-columns:repeat(3,1fr)}
 .mb{font-size:15px;padding:12px}
 main{padding:22px 16px 110px}
 h1{font-size:28px}
 .chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding-bottom:4px}
 .stats{gap:12px}.card{padding:20px;border-radius:22px}.stat .big{font-size:26px;margin:16px 0 6px}
 .grid3,.tips{grid-template-columns:1fr;gap:14px}
 .sched{grid-template-columns:repeat(4,1fr)}
 .cbar{grid-template-columns:1fr 60px}.cbar .bar{grid-column:1/3;grid-row:2}
 .astro{display:none}
 .msg{max-width:92%}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="app">
 <aside class="side">
  <div class="brand">Language Studio</div>
  <nav class="nav" id="nav"></nav>
  <hr>
  <div class="profile">
   <div class="avatar">🐣</div>
   <div><span id="pname" contenteditable="true" spellcheck="false" title="แตะเพื่อเปลี่ยนชื่อ"></span><div class="sync"><span class="dot" id="sdot"></span><span id="stxt">ซิงค์แล้ว</span></div></div>
  </div>
 </aside>
 <main id="main"></main>
</div>
<div class="astro" aria-hidden="true">🧑‍🚀</div>
<div id="ov"></div>

<script>
/* ---------- ภาษา ---------- */
const LANGS=[

const KEY='language-studio-v1';
let S={name:'nnattlh.work',lang:'kr',langs:{},minutes:{},days:[],plan:null};
let view='home',tab='v',openCat=null,search='',Q=null,quizScope='all',FC=null,planDraft=null,lastAct=Date.now(),busy=false;
const CHAT={};
const LG=()=>LANGS.find(l=>l.code===S.lang)||LANGS[0];
const LK=()=>S.lang==='gb'?'us':S.lang;
const L=()=>S.langs[LK()]||(S.langs[LK()]={xp:0,m:{},q:[]});
function mergeEnglish(){const g=S.langs.gb;if(!g)return;const u=S.langs.us||(S.langs.us={xp:0,m:{},q:[]});u.xp=(u.xp||0)+(g.xp||0);u.m=Object.assign({},g.m,u.m);u.q=[...(g.q||[]),...(u.q||[])].slice(-50);
 ['g','gr'].forEach(k=>{if(g[k]){u[k]=u[k]||{};Object.keys(g[k]).forEach(x=>{u[k][x]=typeof g[k][x]==='number'?Math.max(u[k][x]||0,g[k][x]):u[k][x]||g[k][x]})}});
 if(g.srs){u.srs=u.srs||{};Object.keys(g.srs).forEach(x=>{if(!u.srs[x]||u.srs[x].b<g.srs[x].b)u.srs[x]=g.srs[x]})}if(g.level&&!u.level)u.level=g.level;delete S.langs.gb}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const level=xp=>Math.floor(xp/100)+1;
function txt(it,code=S.lang){const lg=LANGS.find(l=>l.code===code);if(code==='gb'&&it.p[2]&&it.p[2]!=='-')return it.p[2];return it.p[lg.col]}
function reading(it){const lg=LG();return lg.rd?it.p[lg.rd]:''}
const mastered=c=>c.items.filter(it=>L().m[it.id]).length;
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function weekMin(){const s=dkey(weekStart());return Object.entries(S.minutes).filter(([k])=>k>=s).reduce((a,[,v])=>a+v,0)}
function streak(){const set=new Set(S.days),d=new Date();if(!set.has(dkey(d)))d.setDate(d.getDate()-1);let c=0;while(set.has(dkey(d))){c++;d.setDate(d.getDate()-1)}return c}
function markStudy(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400)}}
function addXP(n){const l=L();l.xp=Math.max(0,l.xp+n);markStudy();save()}

/* ---------- เสียง ---------- */
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2600)}
function speak(text,tts=LG().tts,rate=.9){try{speakRaw(text,tts,rate)}catch(e){toast('อ่านออกเสียงไม่ได้ในขณะนี้')}}
let VOICES=[];const warned={};
function loadVoices(){try{VOICES=('speechSynthesis' in window&&speechSynthesis.getVoices())||[]}catch(e){VOICES=[]}return VOICES}
function voicesFor(tts){const t=tts.toLowerCase(),base=t.split('-')[0],alt=base==='id'?['id','in']:base==='zh'?['zh','cmn']:[base];
 const list=VOICES.filter(v=>{const l=String(v.lang||'').replace('_','-').toLowerCase();return alt.some(a=>l===a||l.startsWith(a+'-'))});
 const score=v=>{const l=String(v.lang).replace('_','-').toLowerCase();let s=0;if(l===t)s+=10;else if(base==='id'&&l==='in-id')s+=10;
  if(base==='zh'&&/(hk|tw|yue|hant)/.test(l))s-=6;if(/natural|neural|enhanced|premium|google|siri|online/i.test(v.name))s+=3;if(v.default)s+=1;return s};
 return list.sort((a,b)=>score(b)-score(a))}
function pickVoice(code,tts){const list=voicesFor(tts),want=S.voice&&S.voice[code];return list.find(v=>v.voiceURI===want)||list[0]||null}
function speakRaw(text,tts,rate){if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance){toast('หน้าที่เปิดอยู่ไม่รองรับเสียงอ่าน ลองเปิดลิงก์นี้ด้วย Chrome หรือ Safari');return}
 const lg=LANGS.find(l=>l.tts===tts)||LG();if(!VOICES.length)loadVoices();
 const clean=String(text).replace(/\p{Extended_Pictographic}|️/gu,'').replace(/\s\/\s/g,', ').replace(/\.\.\.|…+/g,' ').trim();if(!clean)return;
 const v=pickVoice(lg.code,tts);
 if(!v&&VOICES.length&&!warned[lg.code]){warned[lg.code]=1;toast(`เครื่องนี้ยังไม่มีเสียง ${lg.name} ดูวิธีติดตั้งได้ที่หน้าคำแนะนำ`)}
 /* แบ่งประโยคยาวเป็นท่อน กันเสียงขาดกลางคันบนบางเบราว์เซอร์ */
 const parts=[];(clean.match(/[^.!?。！？]+[.!?。！？]*/g)||[clean]).forEach(s=>{s=s.trim();if(!s)return;const last=parts[parts.length-1];if(last&&last.length+s.length<160)parts[parts.length-1]=last+' '+s;else parts.push(s)});
 speechSynthesis.cancel();
 setTimeout(()=>{parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang.replace('_','-'):tts;if(v)try{u.voice=v}catch(e){}u.rate=Math.max(.4,Math.min(1.6,rate*(S.rate||1)));speechSynthesis.speak(u)});
  try{speechSynthesis.resume()}catch(e){}},80)}
function voiceHtml(){const has='speechSynthesis' in window;const thrToggle=`<label class="chk"><input type="checkbox" id="thrtog" ${S.thr!==false?'checked':''}> 🇹🇭 แสดงคำอ่านภาษาไทยใต้คำศัพท์และประโยค</label>`;if(has&&!VOICES.length)loadVoices();
 const rows=LANGS.map(l=>{const list=voicesFor(l.tts),cur=pickVoice(l.code,l.tts);
  return `<div class="vrow"><div class="vname"><span class="fl">${l.flag}</span><b>${l.name}</b><span class="vst ${list.length?'ok':'no'}">${list.length?'✓ มีเสียง '+list.length:'ไม่พบเสียงในเครื่อง'}</span></div>
  <div class="vctl">${list.length?`<select id="vsel-${l.code}" class="vsel" aria-label="เลือกเสียง ${l.name}">${list.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&cur.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`:`<span class="muted vhelp">จะลองใช้เสียงเริ่มต้นของเครื่องแทน</span>`}
  <button class="saybtn" data-act="vtest" data-v="${l.code}">🔊 ทดสอบ</button></div></div>`}).join('');
 return `<h2 id="voice">🔊 เสียงอ่านทั้ง 9 ภาษา</h2><div class="card">${has?'':'<p class="fb bad" style="margin:0 0 16px">เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง ลองเปิดด้วย Chrome หรือ Safari</p>'}
 <div class="row-sb" style="font-size:16px"><label for="vrate">ความเร็วเสียงอ่าน</label><span id="vrateval">${(S.rate||1).toFixed(1)}×</span></div>
 ${thrToggle}
 <input type="range" id="vrate" min="0.6" max="1.3" step="0.1" value="${S.rate||1}" style="width:100%;accent-color:#8fe9df;margin:8px 0 18px">
 ${rows}
 <details class="vguide"><summary>ไม่มีเสียงบางภาษา? วิธีติดตั้งเสียง</summary><ul>
 <li><b>Android:</b> ตั้งค่า → การเข้าถึง (หรือ จัดการทั่วไป) → แปลงข้อความเป็นเสียง → ตั้งค่าของ Google → ติดตั้งข้อมูลเสียง แล้วเลือกภาษาที่ต้องการ</li>
 <li><b>iPhone / iPad:</b> ตั้งค่า → การช่วยการเข้าถึง → เนื้อหาที่ถูกอ่าน → เสียง แล้วดาวน์โหลดเสียงของแต่ละภาษา</li>
 <li><b>Windows:</b> Settings → Time &amp; language → Speech → Add voices</li>
 <li><b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage Voices</li>
 <li>ติดตั้งเสร็จแล้วปิดและเปิดหน้านี้ใหม่ เสียงจะขึ้นสถานะ ✓ มีเสียง</li></ul></details></div>`}

function apiMessages(arr){const out=[];arr.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).forEach(m=>{const last=out[out.length-1];if(last&&last.role===m.role)last.content+='\n'+m.content;else out.push({role:m.role,content:m.content})});
 while(out.length&&out[0].role!=='user')out.shift();

/* AI ฟรีผ่านอินเทอร์เน็ต (Pollinations) ใช้เมื่อเปิดนอก Claude ไม่ต้องล็อกอิน ไม่ต้องใช้คีย์ */
let lastFree=0;
async function callFree(arr){if(!navigator.onLine){const e=new Error('offline');e.code='offline';throw e}
 const msgs=[];arr.filter(m=>m.role==='user'||m.role==='assistant').slice(-12).forEach(m=>{const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+='\n'+m.content;else msgs.push({role:m.role,content:m.content})});
 while(msgs.length&&msgs[0].role!=='user')msgs.shift();
 const wait=15000-(Date.now()-lastFree);if(wait>0){setLive('รอคิว AI ฟรีอีก '+Math.ceil(wait/1000)+' วินาที…');await new Promise(r=>setTimeout(r,wait));setLive('')}
 const post=async()=>{lastFree=Date.now();const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({model:'openai',private:true,messages:[{role:'system',content:chatSys()},...msgs]})});
  if(r.status===429){const e=new Error('busy');e.code='busy';throw e}if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();try{const j=JSON.parse(t);const c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(c)return c.trim()}catch(_){}return t.trim()};

function gameAct(a,v){
 switch(a){
 case 'gscope':gScope=v;render();return true;

 case 'gml':matchPick('l',v);return true;

 case 'gmc':memPick(+v);return true;
 case 'gbp':{const q=G.qs[G.i];if(!q.pick.includes(+v))q.pick.push(+v);render();return true}
 case 'gbu':G.qs[G.i].pick.splice(+v,1);render();return true;
 case 'gbclear':G.qs[G.i].pick=[];render();return true;
 case 'gbcheck':{const q=G.qs[G.i];G.res=joinT(q.pick.map(pi=>q.pool[pi]))===joinT(q.t)?'ok':'bad';if(G.res==='ok'){G.score+=10;addXP(3)}speak(txt(q.it));render();return true}
 case 'gfo':{const q=G.qs[G.i];q.picked=+v;if(q.opts[+v]===q.ans){G.score+=10;addXP(2)}speak(txt(q.it));render();return true}
 case 'glp':speak(txt(G.qs[G.i].it));return true;
 case 'gls':speak(txt(G.qs[G.i].it),LG().tts,.55);return true;
 case 'glo':{const q=G.qs[G.i];q.picked=+v;if(q.opts[+v]===q.it.p[0]){G.score+=10;addXP(2)}render();return true}
 case 'gth':G.qs[G.i].hint=true;render();return true;
 case 'gtc':{const q=G.qs[G.i],el=document.getElementById('gin');q.val=el?el.value:'';if(!q.val.trim()){el&&el.focus();return true}
  q.res=accepts(q.it,q.val)?'ok':'bad';if(q.res==='ok'){G.score+=q.hint?5:10;addXP(q.hint?1:3)}speak(txt(q.it));render();return true}
 case 'gtskip':{const q=G.qs[G.i];q.res='bad';speak(txt(q.it));render();return true}
 case 'gsp':{if(G.end)return true;const ok=(v==='1')===G.q.yes;if(ok){G.score++;G.streak++;addXP(1)}else{G.wrong++;G.streak=0}G.flash=ok?'ok':'bad';G.q=mkSpeed();render();
  clearTimeout(G.ft);G.ft=setTimeout(()=>{if(G&&G.id==='speed'&&!G.end){G.flash=null;const f=document.querySelector('.fb');if(f)f.remove()}},500);return true}
 case 'gnext':{G.i++;G.res=null;if(G.i>=G.qs.length)endGame(G.id==='speak'?Math.round(G.score/G.qs.length):G.score);else{render();sayQ();if(G.id==='speak')setTimeout(()=>speak(txt(G.qs[G.i].it)),250);const el=document.getElementById('gin');if(el)el.focus()}return true}

function thKR(text){return text.split(/\s+/).filter(Boolean).map(word=>{const ch=[...word];const out=[];
 for(let i=0;i<ch.length;i++){const code=ch[i].charCodeAt(0)-0xAC00;if(code<0||code>11171){if(/[?？]/.test(ch[i]))out.push('?');continue}
  let cho=Math.floor(code/588),jung=Math.floor(code%588/28),jong=code%28;
  const nc=i+1<ch.length?ch[i+1].charCodeAt(0)-0xAC00:-1;
  if(jong&&jong!==21&&nc>=0&&nc<=11171&&Math.floor(nc/588)===11&&KR_MOVE[jong]!==undefined){/* เชื่อมเสียงกับ ㅇ ตัวถัดไป */
   const keep={3:1,5:4,9:8,10:8,11:8,12:8,13:8,14:8,18:17}[jong]||0;ch[i+1]=String.fromCharCode(0xAC00+KR_MOVE[jong]*588+nc%588);jong=keep}
  let F=KR_JONG[jong];const X=KR_CHO[cho];
  if(F&&nc>=0&&nc<=11171){const ni=Math.floor(nc/588);if(ni===2||ni===6)F={'บ':'ม','ก':'ง','ด':'น'}[F]||F}let tpl=F?KR_CLOSE[jung].replace('F',F):KR_OPEN[jung];
  if(!X)tpl=tpl.replace(/X(?=[ยว])/,'').replace('Xโย','โย').replace(/แXย|เXย|แXว|เXว/,m=>m.replace('X',''));
  out.push(tpl.replace('X',X||'อ'))}
 return out.join('')}).join(' ')}

 const s=core.replace(/[^a-z]/g,'');const mor=[];let i=0;

  if(r[0]==='n'&&!/^n[aiueoy]/.test(r)){mor.push({fin:/^n[bmp]/.test(r)?'ม':'น'});i++;continue}

  if(m=r.match(/^(ky|gy|sh|ch|ts|ny|hy|by|py|my|ry|j|[kgsztdnhfbpmyrw])?([aiueo])/)){
   let c=m[1]||'',v=m[2],len=m[0].length,nx=r[len]||'',nx2=r[len+1]||'';let long=false;
   if(nx&&(nx===v||(v==='o'&&nx==='u')||(v==='e'&&nx==='i'))&&!(nx2&&'aiueo'.includes(nx2)&&nx!==v&&false)){long=true;len++}
   let glide=false;if(c.length===2&&c[1]==='y'){glide=true;c=c[0]}

 const out=[];mor.forEach((mo,k)=>{
  if(mo.fin){if(!out.length){out.push(mo.fin);return}let p=out[out.length-1].replace(/ะ$/,'');if(/[^ีู]า$/.test(p)&&!/^เ/.test(p))p=p.replace(/า$/,'ั');out[out.length-1]=p+mo.fin;return}
  const end=k===mor.length-1,{C,v,long,glide}=mo;let s;
  if(glide)s=v==='a'?'เ'+C+'ีย':v==='u'?C+'ิว':v==='o'?'เ'+C+'ียว':C+'ิ';
  else if(v==='a')s=C+(long||!end?'า':'ะ');else if(v==='i')s=C+(long?'ี':'ิ');else if(v==='u')s=C+(long?'ู':'ุ');
  else if(v==='e')s='เ'+C+(long||!end?'':'ะ');else s='โ'+C+(long||!end?'':'ะ');
  out.push(s)});
 return out.join('')+qmark(t)}).join(' ')}

function pySeg(part){const set=pySet(),out=[];let i=0;
 while(i<part.length){let best=0,fallback=0;
  for(let L=Math.min(6,part.length-i);L>0;L--){const c=part.slice(i,i+L);if(!set.has(c))continue;if(!fallback)fallback=L;const rem=part.slice(i+L);
   if(!rem||!/^[aeiouv]/.test(rem)){best=L;break}}
  const L=best||fallback;if(!L){i++;continue}out.push(pySyl(part.slice(i,i+L)));i+=L}
 return out.join('')}

  <h2>📌 หมวดที่แนะนำให้เรียนต่อ</h2><div class="grid3">${rec.map(catCard).join('')}</div><div class="row mt"><button class="btn ghost" data-act="ptx">กลับหน้าประเมิน</button></div>`}
 const q=PTS.qs[PTS.i],r=reading(q.it);
 return header('แบบทดสอบวัดระดับ 🧭',`ข้อ ${PTS.i+1} จาก ${PTS.qs.length} — ยากขึ้นเรื่อยๆ`)+gBar(PTS.i,PTS.qs.length)+`
 <div class="card"><div class="muted">${q.dir==='th'?`คำนี้ใน ${esc(lg.name)} คือข้อไหน?`:'ข้อนี้แปลว่าอะไร?'}</div><div class="qtext">${esc(q.dir==='th'?q.it.p[0]:txt(q.it))}</div>${q.dir==='x'&&r?`<div class="it-r">${esc(r)}</div>`:''}
 ${q.opts.map((o,i)=>{let c='';if(q.picked!==null){if(o===q.ans)c='ok';else if(i===q.picked)c='bad'}return `<button class="opt ${c}" data-act="pto" data-v="${i}" ${q.picked!==null?'disabled':''}>${esc(o)}</button>`}).join('')}
 ${q.picked!==null?`<button class="btn mt" data-act="ptn">${PTS.i+1<PTS.qs.length?'ข้อต่อไป':'ดูระดับของฉัน'}</button>`:''}</div>`}
function placementCard(){const lv=L().level;return `<div class="card ptcard"><div><h3>🧭 แบบทดสอบวัดระดับ</h3><p class="muted mt">20 ข้อ ไล่จากง่ายไปยาก บอกระดับ A1–B2 และแนะนำหมวดที่ควรเรียนต่อ</p>${lv?`<p class="mt">ระดับล่าสุด: <b>${lv.lv}</b> (${lv.pts}/37) · ${lv.d}</p>`:''}</div><button class="btn" data-act="pt">${lv?'วัดระดับอีกครั้ง':'เริ่มวัดระดับ'}</button></div>`}
function srsHomeHtml(){const due=srsDue().length,seen=Object.keys(srsOf()).length;
 return `<h2>📅 ทบทวนวันนี้</h2><div class="card srsc"><div><div class="big" style="margin:0">${due} ใบ</div><div class="muted">${due?'ถึงรอบทบทวนแล้ว ทบทวนตอนนี้จะจำได้นานขึ้น':seen?'ทบทวนครบแล้ว เรียนคำใหม่ต่อได้เลย':'เริ่มฝึกคำใหม่ แล้วระบบจะนัดทบทวนให้เอง'}</div></div>
 <div class="row">${due?`<button class="btn" data-act="srsdue">🃏 ทบทวน ${due} ใบ</button>`:''}<button class="btn ${due?'ghost':''}" data-act="srsnew">🌱 เรียนคำใหม่ 10 คำ</button></div></div>`}
function backupHtml(){return `<h2>💾 สำรองและย้ายข้อมูล</h2><div class="card"><p class="muted">สร้างรหัสสำรองแล้วเก็บไว้ หรือนำไปวางในเครื่องและเบราว์เซอร์อื่น ความคืบหน้าทั้ง 9 ภาษาจะย้ายไปด้วย</p>
 <div class="row mt"><button class="btn" data-act="bkexp">สร้างรหัสสำรอง</button><button class="btn ghost" data-act="bkfile">ดาวน์โหลดไฟล์สำรอง</button></div>
 ${BK.code?`<textarea id="bkout" class="bkta" readonly>${esc(BK.code)}</textarea><button class="btn ghost mt" data-act="bkcopy">📋 คัดลอกรหัส</button>`:''}
 <h3 style="margin-top:24px">นำเข้าข้อมูล</h3><textarea id="bkin" class="bkta" placeholder="วางรหัสสำรองที่นี่">${esc(BK.inVal)}</textarea>
 ${BK.pending?`<div class="fb bad">ข้อมูลในเครื่องนี้จะถูกแทนที่ทั้งหมด ยืนยันไหม?<div class="row mt"><button class="btn" data-act="bkok">ยืนยันนำเข้า</button><button class="btn ghost" data-act="bkno">ยกเลิก</button></div></div>`:`<button class="btn ghost mt" data-act="bkimp">นำเข้าข้อมูล</button>`}
 ${BK.msg?`<p class="mt" style="color:var(--bad)">${esc(BK.msg)}</p>`:''}</div>`}
function thrRow(it){return S.thr!==false?`<div class="it-thr">อ่านว่า ${esc(thRead(it))}</div>`:''}
async function extraAct(a,v){
 switch(a){
 case 'srsdue':{const d=srsDue();if(d.length)startFlash(d,'x');return true}
 case 'srsnew':startFlash(srsNew(10),'x');return true;
 case 'thr':S.thr=S.thr===false;save();render();return true;
 case 'aq':startAlphaQuiz();render();return true;
 case 'aqx':AQ=null;render();return true;
 case 'aqo':{const q=AQ.qs[AQ.i];q.picked=+v;if(q.opts[+v]===q.a[2]){AQ.score++;addXP(1)}speak(q.a[3]||q.a[0]);render();return true}
 case 'aqn':AQ.i++;render();return true;
 case 'asay':speak(v);return true;
 case 'gro':grOpen=grOpen===+v?null:+v;render();return true;
 case 'grs':{const[i,k]=v.split('-').map(Number);speak(GRAM[S.lang][i][2][k][0]);return true}
 case 'grd':{const l=L();l.gr=l.gr||{};if(!l.gr[v]){l.gr[v]=1;addXP(5)}render();return true}
 case 'pt':PTS={qs:makePlacement(),i:0,pts:0};view='quiz';render();scrollTo(0,0);return true;
 case 'pto':{const q=PTS.qs[PTS.i];q.picked=+v;if(q.opts[+v]===q.ans){PTS.pts+=q.tier+1;addXP(2)}speak(txt(q.it));render();return true}
 case 'ptn':PTS.i++;if(PTS.i>=PTS.qs.length){const lv=levelOf(PTS.pts);L().level={lv:lv[1],pts:PTS.pts,d:new Date().toLocaleDateString('th-TH')};markStudy();save()}render();scrollTo(0,0);return true;
 case 'ptx':PTS=null;render();return true;
 case 'spk':{G.rec=true;render();const q=G.qs[G.i];listenOnce(LG().tts,res=>{if(!G||G.id!=='speak')return;G.rec=false;
   if(res.err)q.err=recErr(res.err);else{const b=bestScore(res.alts,txt(q.it));q.err='';if(b.s>q.best){G.score+=b.s-q.best;q.best=b.s}q.said=b.t||res.alts[0]||'';if(b.s>=60)addXP(2)}render()});return true}
 case 'dsel':G={id:'dialog',sc:DIALOGS.find(d=>d.id===v),si:0,log:[],score:0,done:0,opts:[],wrong:[],rec:false,err:'',tries:0};dlgAdvance();render();return true;
 case 'dback':G={id:'dialog',sc:null};render();return true;
 case 'dopt':{const st=G.sc.steps[G.si],it=dlgItem(st[1],st[2]);if(G.opts[+v]===it)dlgAnswer(true);else{G.wrong.push(+v);G.tries++;render()}return true}
 case 'dmic':{G.rec=true;G.err='';render();const st=G.sc.steps[G.si],it=dlgItem(st[1],st[2]);listenOnce(LG().tts,res=>{if(!G||G.id!=='dialog')return;G.rec=false;
   if(res.err){G.err=recErr(res.err);render();return}const b=bestScore(res.alts,txt(it));if(b.s>=60)dlgAnswer(true,b.t);else{G.tries++;G.err=`ได้ยินว่า "${b.t||res.alts[0]||''}" (${b.s}%) ลองพูดอีกครั้ง หรือเลือกจากตัวเลือก`;render()}});return true}
 case 'install':if(INSTALL){INSTALL.prompt();INSTALL.userChoice.finally(()=>{INSTALL=null;render()})}return true;
 case 'bkexp':BK.code=await exportCode();render();return true;
 case 'bkcopy':{const t=document.getElementById('bkout');try{await navigator.clipboard.writeText(BK.code);toast('คัดลอกรหัสแล้ว')}catch(e){if(t){t.select();toast('กดค้างที่ข้อความเพื่อคัดลอก')}}return true}
 case 'bkfile':{try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='language-studio-backup-'+today()+'.json';document.body.appendChild(a2);a2.click();a2.remove();toast('กำลังดาวน์โหลดไฟล์สำรอง')}catch(e){toast('ดาวน์โหลดไม่ได้ ใช้ปุ่มสร้างรหัสสำรองแทน')}return true}
 case 'bkimp':{const t=document.getElementById('bkin');BK.inVal=t?t.value:'';try{BK.pending=await importCode(BK.inVal);BK.msg=''}catch(e){BK.pending=null;BK.msg='รหัสไม่ถูกต้อง ตรวจว่าคัดลอกมาครบทั้งหมด'}render();return true}
 case 'bkok':S=Object.assign({name:S.name,lang:'kr',langs:{},minutes:{},days:[],plan:null},BK.pending);BK={code:'',pending:null,msg:'',inVal:''};save();Object.keys(TH_CACHE).forEach(k=>delete TH_CACHE[k]);toast('นำเข้าข้อมูลเรียบร้อย');render();return true;
 case 'bkno':BK.pending=null;render();return true;
 }return false}

const EXTRA_ACTS=new Set(['srsdue','srsnew','thr','aq','aqx','aqo','aqn','asay','gro','grs','grd','pt','pto','ptn','ptx','spk','dsel','dback','dopt','dmic','install','bkexp','bkcopy','bkfile','bkimp','bkok','bkno']);
Object.assign(GR,GR2);
function render(){renderNav();const V={home:vHome,plan:vPlan,lessons:vLessons,quiz:vQuiz,games:vGames,chat:vChat,tips:vTips,progress:vProgress};
 document.getElementById('main').innerHTML=V[view]();document.getElementById('pname').textContent=S.name;
 const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;drawFlash()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;lastAct=Date.now();
 if(EXTRA_ACTS.has(a)){extraAct(a,v);return}
 if(a[0]==='g'&&gameAct(a,v))return;
 switch(a){
 case 'go':view=v;stopTimer();if(v==='games')G=null;if(v==='lessons')openCat=null;if(v==='plan')planDraft=null;render();scrollTo(0,0);break;
 case 'accent':S.accent=v;S.lang=v;L();stopTimer();G=null;AQ=null;PTS=null;save();toast(v==='us'?'เปลี่ยนเป็นสำเนียงอเมริกัน':'เปลี่ยนเป็นสำเนียงอังกฤษ');render();break;
 case 'lang':if(v==='us'||v==='gb')S.accent=v;S.lang=v;L();stopTimer();G=null;AQ=null;grOpen=null;PTS=null;save();render();break;
 case 'open':view='lessons';openCat=v;tab=catById(v).type;render();scrollTo(0,0);break;
 case 'back':openCat=null;render();break;
 case 'tab':tab=v;search='';render();break;
 case 'say':speak(txt(ITEM[v]));break;
 case 'mark':{const l=L();if(l.m[v]){delete l.m[v];addXP(-10)}else{l.m[v]=1;addXP(10)}render();break}
 case 'flash':openFlash();break;
 case 'fcflip':FC.flip=!FC.flip;if(FC.flip)speak(txt(FC.items[FC.i]));drawFlash();break;
 case 'fcno':{const it=FC.items[FC.i];srsGrade(it.id,false);save();if(!FC.re.has(it.id)){FC.re.add(it.id);FC.items.push(it)}FC.i++;FC.flip=false;drawFlash();if(FC.dir==='x'&&FC.items[FC.i])speak(txt(FC.items[FC.i]));break}
 case 'fcyes':{const it=FC.items[FC.i],l=L();srsGrade(it.id,true);if(!l.m[it.id]){l.m[it.id]=1;addXP(10)}FC.got++;FC.i++;FC.flip=false;drawFlash();if(FC.dir==='x'&&FC.items[FC.i])speak(txt(FC.items[FC.i]));break}
 case 'fcagain':startFlash(FC.src,FC.dir);break;
 case 'fscope':fcOpt.scope=v;render();break;
 case 'fn':fcOpt.n=+v;render();break;
 case 'fdir':fcOpt.dir=v;render();break;
 case 'fstart':startFlash(deckItems(),fcOpt.dir);break;
 case 'godeck':view='lessons';openCat=null;tab='f';search='';render();scrollTo(0,0);break;
 case 'fcclose':FC=null;render();break;
 case 'quizcat':startQuiz(v);break;
 case 'qscope':quizScope=v;render();break;
 case 'qstart':startQuiz(quizScope);break;
 case 'qreset':Q=null;render();break;
 case 'qpick':{const q=Q.qs[Q.i];Q.picked=+v;if(q.opts[+v]===q.ans){Q.score++;addXP(5)}else Q.wrong.push(q.it);speak(txt(q.it));render();break}
 case 'qnext':Q.i++;Q.picked=null;if(Q.i>=Q.qs.length){const l=L();l.q.push({s:Q.score,t:Q.qs.length,d:new Date().toLocaleDateString('th-TH'),scope:quizScope==='all'?'ทุกหมวด':catById(quizScope).name});l.q=l.q.slice(-50);markStudy();save()}render();break;
 case 'pgoal':planDraft.goal=+v;render();break;
 case 'pdays':planDraft.days=+v;render();break;
 case 'pfocus':{const f=planDraft.focus,i=f.indexOf(v);if(i>=0)f.splice(i,1);else if(f.length<4)f.push(v);render();break}
 case 'psave':S.plan=JSON.parse(JSON.stringify(planDraft));save();view='home';render();scrollTo(0,0);break;
 case 'send':{const i=document.getElementById('cin');const t=i.value;i.value='';sendChat(t);break}
 case 'quick':sendChat(v);break;
 case 'retry':sendChat('',true);break;
 case 'saymsg':speak(sayText(CHAT[S.lang][+v].content));break;
 case 'saymsgs':speak(sayText(CHAT[S.lang][+v].content),LG().tts,.6);break;
 case 'saycorr':speak(corrLine(CHAT[S.lang][+v].content));break;
 case 'vtest':{const l=LANGS.find(x=>x.code===v);delete warned[v];speak(txt(ITEM['greet-0'],v)+'. '+txt(ITEM['s_intro-1'],v),l.tts);break}
 case 'govoice':view='tips';render();setTimeout(()=>{const el=document.getElementById('voice');if(el)el.scrollIntoView({behavior:'smooth'})},50);break;
 case 'yt':ytType=v;render();break;
 case 'goyt':view='lessons';openCat=null;tab='y';search='';render();scrollTo(0,0);break;
 case 'saystop':if('speechSynthesis' in window)speechSynthesis.cancel();break;
 }});
document.addEventListener('keydown',e=>{lastAct=Date.now();if(e.target.id==='cin'&&e.key==='Enter'&&!e.isComposing){const t=e.target.value;e.target.value='';sendChat(t)}
 if(e.target.id==='gin'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const q=G&&G.qs&&G.qs[G.i];if(q&&q.res)gameAct('gnext');else gameAct('gtc')}});
document.addEventListener('change',e=>{if(e.target.id==='thrtog'){S.thr=e.target.checked;save()}
 if(e.target.id&&e.target.id.startsWith('vsel-')){S.voice=S.voice||{};S.voice[e.target.id.slice(5)]=e.target.value;save();toast('บันทึกเสียงที่เลือกแล้ว')}
 if(e.target.id==='vrate'){S.rate=+e.target.value;save()}
 if(e.target.id==='autoread'){S.autoRead=e.target.checked;save();if(S.autoRead)toast('เปิดอ่านอัตโนมัติแล้ว')}});
document.addEventListener('input',e=>{if(e.target.id==='bkin')BK.inVal=e.target.value;
 if(e.target.id==='vrate'){const o=document.getElementById('vrateval');if(o)o.textContent=(+e.target.value).toFixed(1)+'×'}
 if(e.target.id==='search'){search=e.target.value.trim();const r=document.getElementById('res');r.innerHTML=search?searchRes():`<div class="grid3">${CATS.filter(c=>c.type===tab).map(catCard).join('')}</div>`}});
document.getElementById('pname').addEventListener('blur',e=>{const n=e.target.textContent.trim();if(n&&n!==S.name){S.name=n.slice(0,30);save()}e.target.textContent=S.name});
document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.addEventListener('pointerdown',()=>lastAct=Date.now());

/* นับเวลาเรียน: ทุก 1 นาทีที่อยู่ในหน้าเรียนและมีการใช้งานภายใน 3 นาที */
setInterval(()=>{if(document.visibilityState==='visible'&&['lessons','quiz','chat','games'].includes(view)&&Date.now()-lastAct<180000){const t=today();S.minutes[t]=(S.minutes[t]||0)+1;markStudy();save()}},60000);

/* ดาว */
(()=>{const s=document.getElementById('stars');let h='';for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*4).toFixed(1)}s;transform:scale(${(.5+Math.random()).toFixed(2)})"></i>`;s.innerHTML=h})();
if('speechSynthesis' in window){loadVoices();const onV=()=>{const n=VOICES.length;loadVoices();if(view==='tips'&&VOICES.length!==n)render()};try{speechSynthesis.addEventListener('voiceschanged',onV)}catch(e){speechSynthesis.onvoiceschanged=onV}setTimeout(onV,1200)}

(async()=>{await load();render()})();
</script>

</body>
